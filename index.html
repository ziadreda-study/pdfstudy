<div id="body">
 <div id="main"><div id="drop"><h1>📘 مذاكرتك</h1><p>اضغط الزرار واختار ملف: PDF أو PowerPoint (pptx) أو Word (docx) أو نص أو صورة.<br>هايلايت، رسم، كتابة، ممحاة، ترجمة للعربي، وبعدين احفظ نسخة عليها شخبطتك.<br>الملف مابيتبعتش لأي مكان، كله على جهازك.</p><label class="go pick">اختار ملف<input id="file2" type="file"></label></div></div>
 <div id="dock">
  <button id="handle" aria-label="الأدوات"><span></span></button>
  <div id="drawer">
   <div class="sec">ملف وتنقل</div>
   <div class="grid">
    <label class="tb pick"><i>📂</i><b>افتح ملف</b><input id="file" type="file"></label>
    <button id="thumbs" class="tb"><i>▦</i><b>الصفحات</b></button>
   </div>
   <div class="sec">أدوات</div>
   <div class="grid">
    <button data-tool="hand" class="tb on"><i>✋</i><b>قراءة</b></button>
    <button data-tool="pen" class="tb"><i>✏️</i><b>قلم</b></button>
    <button data-tool="hl" class="tb"><i>🖍️</i><b>هايلايت</b></button>
    <button data-tool="rect" class="tb"><i>▭</i><b>مربع</b></button>
    <button data-tool="text" class="tb"><i>🅣</i><b>كتابة</b></button>
    <button data-tool="eraser" class="tb"><i><svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true" style="display:block"><g transform="rotate(-28 12 12)"><rect x="3.5" y="8.5" width="17" height="9" rx="2" fill="#ffb3d1" stroke="#c77f9c" stroke-width="1"/><path d="M3.5 13.2h17" stroke="#c77f9c" stroke-width="1"/><rect x="3.5" y="8.5" width="17" height="4.7" rx="2" fill="#fdfdfd" stroke="#c9c9c9" stroke-width=".7"/></g></svg></i><b>ممحاة</b></button>
    <button id="trans" class="tb"><i>🌐</i><b>ترجم</b></button>
   </div>
   <div class="sec">لون وسُمك</div>
   <div id="sw"></div>
   <input id="color" type="color" value="#e03131" title="لون">
   <input id="size" type="range" min="1" max="30" value="3" title="السُمك">
   <div class="grid">
    <button id="undo" class="tb"><i>↶</i><b>تراجع</b></button>
    <button id="redo" class="tb"><i>↷</i><b>إعادة</b></button>
   </div>
   <div class="sec">عرض</div>
   <div class="grid">
    <button id="zin" class="tb"><i>＋</i><b>تكبير</b></button>
    <button id="zout" class="tb"><i>－</i><b>تصغير</b></button>
    <button id="fit" class="tb"><i>⤢</i><b>عرض الصفحة</b></button>
    <button id="night" class="tb"><i>🌙</i><b>ليلي</b></button>
   </div>
   <span id="zv" class="zv">100%</span>
   <div class="sec">مذاكرة</div>
   <div class="grid">
    <button id="note" class="tb"><i>📝</i><b>نوتة</b></button>
    <button id="readpg" class="tb"><i>📷</i><b>اقرأ الصفحة</b></button>
    <button id="fsbtn" class="tb"><i>⛶</i><b>ملء الشاشة</b></button>
    <button id="askchat" class="tb"><i>🤖</i><b>اسأل شات</b></button>
    <button id="srch" class="tb"><i>🔎</i><b>بحث</b></button>
    <button id="bm" class="tb"><i>⭐</i><b>علّم</b></button>
    <button id="bml" class="tb"><i>📚</i><b>المعلّمة</b></button>
    <button id="tmr" class="tb"><i>⏱</i><b>تايمر</b></button>
   </div>
   <div class="sec">حفظ</div>
   <div class="grid one"><button id="save" class="tb acc"><i>💾</i><b>احفظ PDF</b></button></div>
   <a class="infolink" href="info/">ℹ️ معلومات وخصوصية</a>
  </div>
